# Runs release-please on every push to main.
# Creates / updates a Release PR with changelog.
# Merging the Release PR creates a GitHub Release + git tag (vX.Y.Z),
# which triggers the CI workflow to build and push versioned container images.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
